
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion bancaire</title>
    <link rel="stylesheet" href="cnx.css">
</head>

<body>

    <div class="login-container">

        <h1>MyBank</h1>
        <h2>Bienvenue !</h2>
        <p>Connectez-vous à votre compte bancaire</p>

         <form action="epargne.html" method="GET">
            <label>Identifiant</label>
            <input type="text" placeholder="Votre identifiant">

            <label>Mot de passe</label>
            <input type="password" placeholder="Votre mot de passe">

            <a href="#">Mot de passe oublié ?</a>

            <button type="submit">Se connecter</button>
        </form>

    </div>
    <div class="image-section">
    <img src="images/banque.png" alt="MyBank">
</div>

</body>
</html>
