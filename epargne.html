
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBank - Compte épargne</title>
    <link rel="stylesheet" href="epargne.css">
</head>

<body>

<header>
    <h1>MyBank</h1>
    <p>Gestion de votre compte d'épargne</p>
</header>

<main>

    <h2>Mon compte d'épargne</h2>

    <div class="cards">

        <div class="card">
            <h3>Capital initial</h3>
            <p id="capital">300.000 DT</p>
        </div>

        <div class="card">
            <h3>Solde actuel</h3>
            <p id="solde">0.000 DT</p>
        </div>

        <div class="card">
            <h3>Total versements</h3>
            <p id="versements">0.000 DT</p>
        </div>

        <div class="card">
            <h3>Total retraits</h3>
            <p id="retraits">0.000 DT</p>
        </div>

        <div class="card">
            <h3>Intérêts capitalisés</h3>
            <p id="interets">0.000 DT</p>
        </div>

    </div>


    <section class="operation">

        <h2>Effectuer une opération</h2>

        <form id="operationForm">

            <label for="typeOperation">Type d'opération</label>

            <select id="typeOperation" required>
                <option value="">Choisir</option>
                <option value="credit">Versement</option>
                <option value="debit">Retrait</option>
            </select>

            <label for="dateOperation">Date de l'opération</label>

            <input type="date" id="dateOperation" required>

            <label for="montantOperation">Montant en DT</label>

            <input type="number"
                   id="montantOperation"
                   min="0.001"
                   step="0.001"
                   placeholder="Exemple : 100"
                   required>

            <button type="submit">Valider l'opération</button>

            <p id="message"></p>

        </form>

    </section>


    <section class="operations">

        <h2>Tableau des opérations</h2>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Source</th>
                        <th>Débit</th>
                        <th>Crédit</th>
                        <th>Solde</th>
                        <th>Taux</th>
                    </tr>
                </thead>

                <tbody id="tableau">
                </tbody>

            </table>

        </div>

    </section>

</main>

<script src="epargne.js"></script>

</body>
</html>
